name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Builds dist/ (no SITE_URL) and runs the e2e and axe tests against it.
      - run: npm run test:e2e
        env:
          CI: true
      # Mobile Lighthouse on that build: performance ≥ 90, accessibility, best practices and
      # SEO ≥ 95 (median of 3 runs per page), or the build fails. See lighthouserc.json.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scans the whole history, not only the last commit. The archive must match the SHA-256 taken
      # from the release's own checksums file (gitleaks_${VERSION}_checksums.txt) when this was written.
      - name: gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --verbose

  # Production: build for https://inkawasi.es and upload dist/ to Cloudflare Pages.
  # Runs only on main and only once the repository variable CLOUDFLARE_ACCOUNT_ID exists.
  # Secrets live in the `production` environment (limited to main), not in the repository:
  # CLOUDFLARE_API_TOKEN (Pages: Edit) and INKAWASI_PRIVATE_JSON.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://inkawasi.es
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Instagram posts of the last good daily run (contenido.yml), copied from the live site,
      # so a push does not swap them for the fallback photos. No call to Meta here.
      - run: npm run instagram -- --publicado
        env:
          SITE_URL: https://inkawasi.es
      - run: npm run build
        env:
          SITE_URL: https://inkawasi.es
          INKAWASI_PRIVATE_JSON: ${{ secrets.INKAWASI_PRIVATE_JSON }}
      - name: Create the Pages project on first deploy
        run: |
          npx --yes wrangler@4.152.0 pages project list | grep -q 'example-project.pages.dev' ||
            npx --yes wrangler@4.152.0 pages project create example-project --production-branch=main
      - run: npx --yes wrangler@4.152.0 pages deploy dist --project-name=example-project --branch=main
      # What visitors get, whether Cloudflare serves the site or the Netlify gateway does: no
      # noindex on the pages, a one-year cache on assets, no origin host in redirects or HTML,
      # www and the old Netlify address in one 301 (docs/deployment.md).
      - run: npx tsx scripts/check-gateway.ts https://inkawasi.es

  # Preview: every other branch gets its own URL, <branch>.example-project.pages.dev (noindex, see
  # public/_headers). Built without SITE_URL, so it needs no private data: the legal pages show
  # the template's placeholders. The `preview` environment holds only CLOUDFLARE_API_TOKEN;
  # until it does, the job says so and skips the upload.
  preview:
    needs: verify
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload the preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.152.0 pages deploy dist --project-name=example-project --branch="${GITHUB_REF_NAME}"
      - name: Explain a skipped preview
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::No CLOUDFLARE_API_TOKEN in the preview environment, so no preview was uploaded."
