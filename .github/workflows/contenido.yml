name: Contenido

# Keeps the Instagram section of the home page up to date. Every morning it reads the latest posts and deploys only if they changed; on
# Mondays it also renews the Instagram token. When something fails nothing is deployed, so the
# site keeps the last good posts, and an issue explains what to do:
#   - token refused: at once, and the run fails;
#   - Meta not answering: only after 3 days in a row (a bad day is normal);
#   - renewal or deploy failed: at once, and the run fails.
#
# Scheduled runs only happen on the default branch (main). Secrets, in the `production`
# environment: INSTAGRAM_TOKEN, SECRETS_WRITE_TOKEN (a fine-grained token that may write this
# repository's environment secrets, to store the renewed token), CLOUDFLARE_API_TOKEN and
# INKAWASI_PRIVATE_JSON; variable CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:
    inputs:
      renew:
        description: Renew the Instagram token now
        type: boolean
        default: false
      test_invalid_token:
        description: 'Test: read Instagram with an invalid token (does not deploy, opens the issue)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  instagram:
    # Like the deploy job of ci.yml: only where the site is deployed from. A fork or the public copy
    # has no CLOUDFLARE_ACCOUNT_ID, so it never runs there (no token, no daily red runs).
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://inkawasi.es
    # Shared with the deploy job of ci.yml: never two production uploads at once.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SITE_URL: https://inkawasi.es
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Days in a row that Meta did not answer, carried from one run to the next.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .instagram-failures
          key: instagram-failures-${{ github.run_id }}
          restore-keys: instagram-failures-

      # Exit codes of scripts/instagram.ts: 0 done, 2 Meta did not answer, 3 token refused,
      # 4 anything else. It also writes `changed=true|false`.
      # The test option sends Meta a made-up token, so the refused-token path runs for real
      # without touching the secret.
      - name: Read the latest posts
        id: fetch
        env:
          INSTAGRAM_TOKEN: ${{ inputs.test_invalid_token && 'IGAAtoken-invalid-test' || secrets.INSTAGRAM_TOKEN }}
        run: |
          set +e
          npm run --silent instagram
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        if: steps.fetch.outputs.code == '0' && steps.fetch.outputs.changed == 'true'
        run: npm run build
        env:
          INKAWASI_PRIVATE_JSON: ${{ secrets.INKAWASI_PRIVATE_JSON }}
          # Without this, the first new Instagram post would take the reservation page down.
          BOOKINGS_VISIBLE: '1'

      - name: Deploy
        id: deploy
        if: steps.build.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 pages deploy dist --project-name=example-project --branch=main

      # Same check as the deploy job of ci.yml: what visitors get through the Netlify gateway.
      - name: Check the gateway
        id: gateway
        if: steps.deploy.outcome == 'success'
        run: npx tsx scripts/check-gateway.ts https://inkawasi.es

      # A token must be at least a day old to renew, and lasts 60 days from then: once a week
      # leaves room for a few failed Mondays.
      - name: Renew the token (Mondays)
        id: renew
        if: always() && steps.fetch.outputs.code != '3' && !inputs.test_invalid_token
        env:
          RENEW: ${{ inputs.renew }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
        run: |
          if [ "$RENEW" != true ] && { [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$(TZ=Europe/Madrid date +%u)" != 1 ]; }; then
            echo "Not Monday: nothing to renew."
            exit 0
          fi
          file="$RUNNER_TEMP/instagram-token"
          trap 'rm -f "$file"' EXIT
          npm run --silent instagram -- --renew --output "$file"
          gh secret set INSTAGRAM_TOKEN --env production < "$file"
          echo "INSTAGRAM_TOKEN updated in the production environment."

      - name: Decide
        id: verdict
        if: always()
        run: |
          code="${{ steps.fetch.outputs.code }}"
          days=$(cat .instagram-failures 2>/dev/null || echo 0)
          if [ "$code" = 2 ]; then days=$((days + 1)); else days=0; fi
          echo "$days" > .instagram-failures
          problem=""
          case "$code" in
            0) ;;
            2) if [ "$days" -ge 3 ]; then problem=meta; else
                 echo "::warning::Instagram did not answer today (day $days of 3). The site keeps the last posts."
               fi ;;
            3) problem=token ;;
            *) problem=other ;;
          esac
          if [ -z "$problem" ] && { [ "${{ steps.build.outcome }}" = failure ] || [ "${{ steps.deploy.outcome }}" = failure ] || [ "${{ steps.gateway.outcome }}" = failure ]; }; then
            problem=deploy
          fi
          if [ -z "$problem" ] && [ "${{ steps.renew.outcome }}" = failure ]; then problem=renew; fi
          echo "problem=$problem" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .instagram-failures
          key: instagram-failures-${{ github.run_id }}

      - name: Open or update the issue
        if: always() && steps.verdict.outputs.problem != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEM: ${{ steps.verdict.outputs.problem }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The Instagram section is not updating"
          case "$PROBLEM" in
            token) what="Instagram does not accept the token: it has expired or been revoked.

          What to do (about 2 minutes):
          1. At https://developers.facebook.com/apps open the Inkawasi app → Instagram → \"API setup with Instagram login\" → \"Generate token\", and sign in with the restaurant's Instagram account.
          2. Copy the token.
          3. On GitHub: Settings → Environments → production → INSTAGRAM_TOKEN → Update secret, and paste it.
          4. In Actions → Contenido → Run workflow, start it by hand." ;;
            meta) what="The Instagram API has not answered for 3 days in a row. It may be a Meta outage or a change in their API. If it is still the same tomorrow, it needs a look." ;;
            renew) what="The token could not be renewed. The current one stays valid until 60 days after the last renewal. Check that the SECRETS_WRITE_TOKEN secret has not expired." ;;
            deploy) what="The posts were read, but the build or the upload to Cloudflare failed." ;;
            *) what="Reading Instagram failed for an unexpected reason." ;;
          esac
          body="$what

          The site keeps showing the last good posts. Run details: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the issue once it works again
        if: steps.verdict.outputs.problem == '' && steps.fetch.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="The Instagram section is not updating"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then gh issue close "$number" --comment "Working again."; fi

      - name: Fail the run if a person has to act
        if: always() && steps.verdict.outputs.problem != ''
        run: |
          echo "::error::Instagram: ${{ steps.verdict.outputs.problem }} (see the issue)."
          exit 1
